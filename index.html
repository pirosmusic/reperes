<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Iris — auto-évaluations psychologiques sérieuses</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-text:#006300;
  --seg-ok:rgba(12,163,12,.13); --seg-ok-c:rgba(12,163,12,.30);
  --seg-warn:rgba(250,178,25,.16); --seg-warn-c:rgba(250,178,25,.42);
  --seg-crit:rgba(208,59,59,.11); --seg-crit-c:rgba(208,59,59,.30);
  --seg-neu:rgba(137,135,129,.12); --seg-neu-c:rgba(137,135,129,.32);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
    --good-text:#0ca30c;
    --seg-ok:rgba(12,163,12,.16); --seg-ok-c:rgba(12,163,12,.38);
    --seg-warn:rgba(250,178,25,.13); --seg-warn-c:rgba(250,178,25,.38);
    --seg-crit:rgba(230,103,103,.13); --seg-crit-c:rgba(230,103,103,.36);
    --seg-neu:rgba(137,135,129,.14); --seg-neu-c:rgba(137,135,129,.40);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:.97rem; line-height:1.55;
}
#app{max-width:680px; margin:0 auto; padding:14px 14px 96px}
a{color:var(--accent); text-decoration:none}
h1{font-size:1.28rem; line-height:1.25; margin:.4rem 0 .5rem; letter-spacing:-.01em}
h2{font-size:1.06rem; margin:1.4rem 0 .5rem}
h3{font-size:.97rem; margin:1rem 0 .3rem}
p{margin:.45rem 0}
.small{font-size:.84rem} .muted{color:var(--muted)} .ink2{color:var(--ink2)}
.center{text-align:center}

/* ---- cards & chrome ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 16px; margin:10px 0}
.card.tap{cursor:pointer; transition:transform .06s} .card.tap:active{transform:scale(.985)}
.hdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.brand{font-weight:800; font-size:1.05rem; letter-spacing:-.01em}
.brand small{font-weight:500; color:var(--muted)}
.pill{display:inline-block; font-size:.72rem; font-weight:600; color:var(--ink2); background:var(--accent-soft); border-radius:99px; padding:2px 9px; margin-right:6px}
.pill.warnp{background:var(--seg-crit); color:var(--ink2)}
.testmeta{font-size:.8rem; color:var(--muted); margin-top:2px}
.done{font-size:.8rem; color:var(--good-text); font-weight:600}
.right{margin-left:auto}
hr{border:none; border-top:1px solid var(--grid); margin:14px 0}

/* ---- chips (statut : pastille + libellé, jamais couleur seule) ---- */
.chip{display:inline-flex; align-items:center; gap:7px; font-size:.86rem; font-weight:700}
.dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:1px solid var(--border)}
.dot.ok{background:var(--good)} .dot.attention{background:var(--warn)}
.dot.alerte{background:var(--crit)} .dot.neutre{background:var(--muted)} .dot.info{background:var(--accent)}

/* ---- buttons ---- */
.btn{display:block; width:100%; border:none; border-radius:12px; min-height:50px;
  background:var(--accent); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; padding:12px 16px; margin:8px 0}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.slim{min-height:42px; padding:8px 14px; font-size:.9rem; width:auto; display:inline-block}
.linkbtn{background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:0}

/* ---- passation ---- */
.progress{height:4px; background:var(--grid); border-radius:2px; margin:10px 0 4px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .2s}
.qcount{font-size:.78rem; color:var(--muted); margin:6px 0 2px}
.qtext{font-size:1.13rem; font-weight:700; line-height:1.4; margin:8px 0 14px}
.consigne{font-size:.84rem; color:var(--ink2); background:var(--accent-soft); border-radius:10px; padding:8px 12px}
.opt{display:block; width:100%; text-align:left; background:var(--surface); color:var(--ink);
  border:1.5px solid var(--line); border-radius:12px; min-height:50px; padding:12px 14px;
  font-size:.95rem; font-weight:600; margin:7px 0; cursor:pointer}
.opt:active,.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.runnav{display:flex; justify-content:space-between; align-items:center; margin-top:10px}

/* ---- résultats ---- */
.scorebig{font-size:1.9rem; font-weight:800; letter-spacing:-.02em}
.scorebig small{font-size:1rem; font-weight:600; color:var(--muted)}
.dimblock{margin:4px 0 6px}
svg{display:block}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.seg.ok{fill:var(--seg-ok)} .seg.ok.cur{fill:var(--seg-ok-c)}
.seg.attention{fill:var(--seg-warn)} .seg.attention.cur{fill:var(--seg-warn-c)}
.seg.alerte{fill:var(--seg-crit)} .seg.alerte.cur{fill:var(--seg-crit-c)}
.seg.neutre{fill:var(--seg-neu)} .seg.neutre.cur{fill:var(--seg-neu-c)}
.mark{fill:var(--ink); stroke:var(--surface); stroke-width:2}
.tick{fill:var(--muted); font-size:10px}
.gridln{stroke:var(--grid); stroke-width:1}
.axisln{stroke:var(--line); stroke-width:1}
.ln{stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}
.pt{fill:var(--accent); stroke:var(--surface); stroke-width:2}
.lbl{fill:var(--ink); font-size:11px; font-weight:700}
.lblm{fill:var(--muted); font-size:10px}
details{border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin:8px 0; background:var(--surface)}
details summary{cursor:pointer; font-weight:700; font-size:.93rem; color:var(--ink)}
details[open] summary{margin-bottom:6px}
.axe{margin:10px 0}
.axe b{display:block; margin-bottom:2px}
.axe p{margin:2px 0; color:var(--ink2)}
.objectif{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.92rem}
.reslist{padding-left:18px; margin:6px 0} .reslist li{margin:7px 0; font-size:.86rem; color:var(--ink2)}
.consult{border-left:3px solid var(--warn); padding:2px 0 2px 12px; margin:10px 0; font-size:.92rem}
.urgence{border:1.5px solid var(--crit); border-radius:12px; padding:12px 14px; margin:10px 0; background:var(--surface)}
.urgence h3{margin-top:0; color:var(--crit)}
.urgence li{margin:6px 0; font-size:.92rem}
.avert{font-size:.87rem; color:var(--ink2); border-left:3px solid var(--line); padding-left:12px; margin:10px 0}

/* ---- tableau / historique ---- */
table{width:100%; border-collapse:collapse; font-size:.88rem}
th{text-align:left; color:var(--muted); font-weight:600; font-size:.78rem; padding:6px 8px 6px 0; border-bottom:1px solid var(--grid)}
td{padding:7px 8px 7px 0; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums}
.delta-good{color:var(--good-text); font-weight:700}
.delta-bad{color:var(--crit); font-weight:700}
.delta-neu{color:var(--muted); font-weight:600}

/* ---- nav ---- */
nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:6px 0 max(8px, env(safe-area-inset-bottom)); z-index:10}
nav button{background:none; border:none; color:var(--muted); font-size:.7rem; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 18px; font-family:inherit}
nav button.on{color:var(--accent)}
nav svg{width:22px; height:22px}
.foot{margin-top:26px; font-size:.78rem; color:var(--muted); text-align:center}
.foot a{font-weight:600}
.catlabel{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 2px 6px}
.notice{font-size:.83rem; color:var(--ink2); background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:9px 12px; margin:10px 0}
.prio{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--grid)}
.prio:last-child{border-bottom:none}
.prio .dot{margin-top:5px}
.sparkwrap{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap}
.quad text{font-size:10px}
</style>
</head>
<body>
<div id="app" role="main"></div>
<nav aria-label="Navigation principale">
  <button id="nav-home" onclick="location.hash='#/'" aria-label="Tests">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Tests</button>
  <button id="nav-bord" onclick="location.hash='#/bord'" aria-label="Tableau de bord">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Suivi</button>
  <button id="nav-meth" onclick="location.hash='#/methode'" aria-label="Méthode et références">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="M12 16v-5M12 8h.01"/></svg>Méthode</button>
</nav>
<script>
/* ============================================================
   DONNÉES — PARTIE 1 : Big Five (Mini-IPIP), Estime de soi (Rosenberg),
   Anxiété (GAD-7), Humeur (PHQ-9)
   Tous les instruments : libres de droits ou d'usage libre, références citées.
   ============================================================ */

var ECH_ACCORD5 = { labels: ["Pas du tout d'accord", "Plutôt pas d'accord", "Neutre", "Plutôt d'accord", "Tout à fait d'accord"], valeurs: [1, 2, 3, 4, 5] };
var ECH_FREQ4 = { labels: ["Jamais", "Plusieurs jours", "Plus de la moitié des jours", "Presque tous les jours"], valeurs: [0, 1, 2, 3] };

var TESTS_1 = [

/* ---------------- 1. BIG FIVE — Mini-IPIP ---------------- */
{
  id: "bigfive",
  nom: "Personnalité : les Big Five",
  sigle: "Mini-IPIP · 20 items",
  cat: "Personnalité",
  duree: "4-5 min",
  radar: true,
  intro: "Le modèle en cinq facteurs (Big Five) est le modèle de la personnalité le plus solide et le plus répliqué de la psychologie scientifique — à l'opposé des typologies non validées (MBTI, « types » des quizz en ligne). Il décrit cinq grandes dimensions continues, sans « bon » ni « mauvais » profil.",
  consigne: "Indiquez à quel point chaque affirmation vous décrit tel(le) que vous êtes généralement, en vous comparant à des personnes de votre âge.",
  echelle: ECH_ACCORD5,
  items: [
    { t: "Je suis le boute-en-train des soirées", d: "E" },
    { t: "Je compatis aux sentiments des autres", d: "A" },
    { t: "Je fais les tâches ménagères et corvées sans tarder", d: "C" },
    { t: "J'ai de fréquentes sautes d'humeur", d: "N" },
    { t: "J'ai une imagination débordante", d: "O" },
    { t: "Je ne parle pas beaucoup", d: "E", r: true },
    { t: "Les problèmes des autres ne m'intéressent pas", d: "A", r: true },
    { t: "J'oublie souvent de remettre les choses à leur place", d: "C", r: true },
    { t: "Je suis détendu(e) la plupart du temps", d: "N", r: true },
    { t: "Les idées abstraites ne m'intéressent pas", d: "O", r: true },
    { t: "Dans les soirées, je parle avec beaucoup de personnes différentes", d: "E" },
    { t: "Je ressens les émotions des autres", d: "A" },
    { t: "J'aime l'ordre", d: "C" },
    { t: "Je me contrarie facilement", d: "N" },
    { t: "J'ai du mal à comprendre les idées abstraites", d: "O", r: true },
    { t: "Je reste en retrait", d: "E", r: true },
    { t: "Je ne m'intéresse pas vraiment aux autres", d: "A", r: true },
    { t: "Je mets la pagaille", d: "C", r: true },
    { t: "Je me sens rarement cafardeux(se)", d: "N", r: true },
    { t: "Je n'ai pas une bonne imagination", d: "O", r: true }
  ],
  scoringNote: "Score = moyenne des 4 items de chaque dimension (items inversés recodés), de 1 à 5. Il n'existe pas de normes officielles françaises pour le Mini-IPIP : les repères « plutôt bas / moyen / plutôt haut » sont indicatifs (coupures à 2,5 et 3,5).",
  dims: {
    E: {
      nom: "Extraversion", format: "moyenne", min: 1, max: 5, valence: null,
      descriptif: "Tendance à rechercher la stimulation sociale, à s'exprimer, à ressentir des émotions positives en groupe. Les introvertis ne sont ni timides ni asociaux : ils rechargent leurs batteries autrement.",
      bandes: [
        { max: 2.5, label: "Plutôt introverti(e)", niveau: "neutre", texte: "Vous préférez probablement les échanges en petit comité, la profondeur à la quantité, et vous avez besoin de temps seul(e) pour récupérer. C'est un fonctionnement, pas un défaut." },
        { max: 3.5, label: "Ambiverti(e)", niveau: "neutre", texte: "Vous alternez selon le contexte entre sociabilité et retrait. C'est le profil le plus fréquent en population générale." },
        { max: 5, label: "Plutôt extraverti(e)", niveau: "neutre", texte: "Le contact social vous stimule et vous nourrit. Veillez simplement à préserver des temps de récupération et d'écoute." }
      ],
      amelioration: {
        intro: "L'extraversion n'a pas à « augmenter » : la question utile est de savoir si votre vie sociale actuelle vous convient. La recherche (Roberts et al., 2017) montre qu'on peut infléchir volontairement ses traits, modestement mais durablement.",
        axes: [
          { titre: "Si vous voulez plus d'aisance sociale", texte: "Exposition graduée et régulière : des micro-interactions faciles (saluer, poser une question à un commerçant), puis des situations plus engageantes. La régularité compte plus que l'intensité." },
          { titre: "Si vous êtes très extraverti(e)", texte: "Travaillez l'écoute active (reformuler avant de répondre) et tolérez les silences : c'est ce qui transforme la sociabilité en qualité relationnelle." },
          { titre: "Distinguer introversion et anxiété sociale", texte: "Préférer la solitude est un trait ; éviter les autres par peur du jugement est de l'anxiété, qui se traite très bien (TCC). Si l'évitement vous fait souffrir, voyez le test d'anxiété et un professionnel." }
        ],
        objectif: "Choisissez UN comportement concret (ex. : proposer un café à un collègue par semaine), tenez-le 6 semaines, puis refaites le test. Visez un changement de comportement qui vous convient, pas un score.",
        ressources: [
          "Roberts, B. W. et al. (2017). A systematic review of personality trait change through intervention. Psychological Bulletin, 143(2).",
          "Susan Cain, « La force des discrets » (JC Lattès) — sur la valeur de l'introversion.",
          "Annuaire des thérapeutes TCC : aftcc.org (si anxiété sociale)."
        ]
      }
    },
    A: {
      nom: "Agréabilité", format: "moyenne", min: 1, max: 5, valence: null,
      descriptif: "Tendance à la coopération, à la confiance, à l'empathie. Un score élevé facilite les relations ; un score bas peut aider à négocier et à dire non — chaque pôle a ses forces et ses angles morts.",
      bandes: [
        { max: 2.5, label: "Plutôt bas", niveau: "neutre", texte: "Vous êtes probablement direct(e), compétitif(ve), peu enclin(e) à vous laisser marcher dessus. Angle mort possible : la dureté perçue par les autres, qui peut coûter cher relationnellement." },
        { max: 3.5, label: "Moyen", niveau: "neutre", texte: "Équilibre entre coopération et affirmation de soi." },
        { max: 5, label: "Plutôt haut", niveau: "neutre", texte: "L'harmonie et l'entraide comptent beaucoup pour vous. Angle mort possible : difficulté à dire non, à défendre vos intérêts, tendance à passer après les autres." }
      ],
      amelioration: {
        axes: [
          { titre: "Si score bas : entraîner l'empathie délibérée", texte: "Avant de répondre dans un désaccord, reformulez la position de l'autre jusqu'à ce qu'il la valide (« steelmanning »). L'empathie est une compétence entraînable, pas un don." },
          { titre: "Si score haut : affirmation de soi", texte: "L'assertivité s'apprend (protocoles TCC bien validés) : exprimer un refus ou une demande de façon claire et non agressive, en commençant par des situations à faible enjeu." },
          { titre: "Attention au lien avec l'estime de soi", texte: "Dire oui à tout pour être apprécié(e) relève souvent de l'estime de soi plus que de la gentillesse. Voyez le test de Rosenberg si c'est votre cas." }
        ],
        objectif: "Score bas : une reformulation empathique par jour pendant 3 semaines. Score haut : un « non » posé et argumenté par semaine. Refaites le test après 6 semaines.",
        ressources: [
          "Fanget, F. « Affirmez-vous ! » (Odile Jacob) — référence francophone de l'assertivité, base TCC.",
          "Christophe André & Patrick Légeron, « La peur des autres » (Odile Jacob)."
        ]
      }
    },
    C: {
      nom: "Conscienciosité", format: "moyenne", min: 1, max: 5, valence: null,
      descriptif: "Organisation, autodiscipline, fiabilité, orientation vers les buts. C'est le trait le plus prédictif de la réussite professionnelle et de la santé à long terme dans les études longitudinales.",
      bandes: [
        { max: 2.5, label: "Plutôt bas", niveau: "neutre", texte: "Spontanéité et flexibilité, mais probablement des difficultés d'organisation, de procrastination ou de suivi des engagements qui peuvent vous coûter." },
        { max: 3.5, label: "Moyen", niveau: "neutre", texte: "Organisation correcte sans rigidité." },
        { max: 5, label: "Plutôt haut", niveau: "neutre", texte: "Discipline et fiabilité élevées. Angle mort possible : perfectionnisme, rigidité, difficulté à déléguer ou à lâcher prise." }
      ],
      amelioration: {
        intro: "Bonne nouvelle : la conscienciosité est l'un des traits qui répond le mieux aux interventions volontaires, surtout via les habitudes et l'environnement plutôt que la « volonté ».",
        axes: [
          { titre: "Intentions d'implémentation", texte: "La technique la plus validée (Gollwitzer, méta-analyses) : formuler « SI situation X, ALORS je fais Y » (« si je pose mon téléphone sur la table du salon, alors je le mets en charge dans l'entrée »). Double environ le taux de suivi des objectifs." },
          { titre: "Réduire la friction, pas augmenter l'effort", texte: "Préparez l'environnement : sortir les affaires de sport la veille, listes de contrôle, rappels. La discipline des gens « disciplinés » est surtout un bon aménagement de l'environnement." },
          { titre: "Si perfectionnisme", texte: "Fixez des critères de « suffisamment bien » AVANT de commencer une tâche, et un temps maximal. Le perfectionnisme clinique se travaille bien en TCC." }
        ],
        objectif: "Choisissez UNE habitude clé, écrivez son plan « si… alors… », suivez-la sur un calendrier visible. Objectif : 80 % de jours tenus sur 6 semaines, puis refaites le test.",
        ressources: [
          "Gollwitzer, P. & Sheeran, P. (2006). Implementation intentions and goal achievement. Advances in Experimental Social Psychology, 38.",
          "Duhigg, C. « Le pouvoir des habitudes » (Flammarion) — vulgarisation correcte des mécanismes.",
          "Sur la procrastination : Steel, P. (2007). The nature of procrastination. Psychological Bulletin, 133(1)."
        ]
      }
    },
    N: {
      nom: "Névrosisme (instabilité émotionnelle)", format: "moyenne", min: 1, max: 5, valence: false,
      descriptif: "Tendance à ressentir des émotions négatives (inquiétude, irritabilité, humeur changeante). C'est la dimension la plus liée au bien-être — et celle qui se travaille le mieux en psychothérapie.",
      bandes: [
        { max: 2.5, label: "Stabilité émotionnelle élevée", niveau: "ok", texte: "Vous encaissez bien les contrariétés et gardez un moral stable. C'est un facteur protecteur pour la santé mentale et physique." },
        { max: 3.5, label: "Moyen", niveau: "neutre", texte: "Réactivité émotionnelle dans la moyenne : des hauts et des bas normaux, sans vulnérabilité marquée." },
        { max: 5, label: "Réactivité émotionnelle élevée", niveau: "attention", texte: "Vous ressentez les émotions négatives plus fort et plus souvent que la moyenne. Ce n'est pas une maladie, mais c'est un facteur de vulnérabilité au stress, à l'anxiété et à la dépression — et ça se travaille très bien." }
      ],
      amelioration: {
        intro: "Le névrosisme est le trait qui diminue le plus en psychothérapie (Roberts et al., 2017 : effets significatifs en quelques semaines, maintenus des années). C'est l'axe d'amélioration au meilleur rendement de toute la psychologie.",
        axes: [
          { titre: "Thérapies cognitivo-comportementales (TCC)", texte: "Apprendre à repérer et à réévaluer les pensées automatiques catastrophistes. C'est l'approche la plus validée pour réduire la réactivité émotionnelle." },

"use strict";

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function byId(id){ return TESTS.find(function(t){ return t.id === id; }); }
function fmtDate(iso){
  try { return new Intl.DateTimeFormat("fr-FR", {day:"numeric", month:"short", year:"numeric"}).format(new Date(iso)); }
  catch(e){ return iso.slice(0,10); }
}
function fmtDateH(iso){
  try { return new Intl.DateTimeFormat("fr-FR", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}).format(new Date(iso)); }
  catch(e){ return iso.slice(0,16).replace("T"," "); }

/* ---------- Stockage (localStorage si disponible, sinon mémoire) ---------- */
var Store = (function(){
  var KEY = "iris.v1";
  var mem = null;
  var persistent = true;
  function blank(){ return { v: 1, results: {} }; }
  function load(){
    if (mem) return mem;
    try {
      var raw = window.localStorage.getItem(KEY);
      mem = raw ? JSON.parse(raw) : blank();
      if (!mem || typeof mem !== "object" || !mem.results) mem = blank();
    } catch(e){ persistent = false; mem = blank(); }
    return mem;
  }
  function save(){
    try { window.localStorage.setItem(KEY, JSON.stringify(mem)); persistent = true; }
    catch(e){ persistent = false; }
  }
  return {
    data: load,
    isPersistent: function(){ load(); return persistent; },
    add: function(testId, rec){
      var d = load();
      if (!d.results[testId]) d.results[testId] = [];
      d.results[testId].push(rec);
      save();
    },
    hist: function(testId){ var d = load(); return (d.results[testId] || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }); },
    latest: function(testId){ var h = this.hist(testId); return h.length ? h[h.length-1] : null; },
    previous: function(testId){ var h = this.hist(testId); return h.length > 1 ? h[h.length-2] : null; },
    exportJSON: function(){ return JSON.stringify(load(), null, 2); },
    importJSON: function(text){
      var inc = JSON.parse(text);
      if (!inc || !inc.results) throw new Error("format");
      var d = load(); var n = 0;
      Object.keys(inc.results).forEach(function(tid){
        if (!d.results[tid]) d.results[tid] = [];
        (inc.results[tid] || []).forEach(function(rec){
          if (rec && rec.date && !d.results[tid].some(function(r){ return r.date === rec.date; })){ d.results[tid].push(rec); n++; }
        });
      });
      save(); return n;
    },
    reset: function(){ mem = blank(); save(); }
  };
})();

/* ---------- Scoring ---------- */
function itemScale(test, it){
  if (it && it.e !== undefined && test.echelles) return test.echelles[it.e];
  return test.echelle;
}
function computeScores(test, answers){
  var acc = {};
  test.items.forEach(function(it, i){
    var raw = answers[i];
    var v = itemScale(test, it).valeurs;
    var mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
    var val = it.r ? (mn + mx - raw) : raw;
    if (!acc[it.d]) acc[it.d] = [];
    acc[it.d].push(val);
  });
  var scores = {};
  Object.keys(test.dims).forEach(function(k){
    var vals = acc[k] || [];
    var sum = vals.reduce(function(a,b){ return a+b; }, 0);
    var f = test.dims[k].format;
    if (f === "moyenne") scores[k] = Math.round((sum / vals.length) * 100) / 100;
    else if (f === "pct25") scores[k] = sum * 4;
    else scores[k] = sum; /* somme */
  });
  var flags = {};
  if (test.flagCrise && answers[test.flagCrise.itemIndex] >= test.flagCrise.seuil) flags.crise = true;
  return { scores: scores, flags: flags };
}
function bandOf(dim, score){
  for (var i = 0; i < dim.bandes.length; i++){
    if (score <= dim.bandes[i].max + 1e-9) return dim.bandes[i];
  }
  return dim.bandes[dim.bandes.length - 1];
}
function fmtScore(dim, v){
  if (dim.format === "moyenne" && dim.max <= 7) return String(Math.round(v*10)/10).replace(".", ",");
  return String(Math.round(v));
}
function fmtOutOf(dim, v){
  return '<span class="scorebig">' + fmtScore(dim, v) + '<small> / ' + dim.max + '</small></span>';
}

/* ---------- Jauge à bandes (SVG) ---------- */
function gaugeSVG(dim, score){
  var W = 340, H = 58, x0 = 8, x1 = W - 8, ty = 20, th = 13;
  var span = dim.max - dim.min;
  function X(v){ return x0 + (v - dim.min) / span * (x1 - x0); }
  var cur = bandOf(dim, score);
  var parts = [];
  var prev = dim.min;
  dim.bandes.forEach(function(b, i){
    var xa = X(prev), xb = X(Math.min(b.max, dim.max));
    var gap = i === 0 ? 0 : 1;               /* espace 2px entre segments */
    var isCur = (b === cur);
    var rx = 4;
    parts.push('<rect class="seg ' + b.niveau + (isCur ? ' cur' : '') + '" x="' + (xa + gap) + '" y="' + ty + '" width="' + Math.max(1, xb - xa - gap*2) + '" height="' + th + '" rx="' + rx + '"/>');
    prev = b.max;
  });
  /* graduations : bornes de bandes + extrémités */
  var seen = {};
  var ticks = [dim.min].concat(dim.bandes.map(function(b){ return b.max; }));
  ticks.forEach(function(v){
    if (v > dim.max) v = dim.max;
    var key = String(Math.round(v*10));
    if (seen[key]) return; seen[key] = 1;
    var anchor = v <= dim.min ? "start" : (v >= dim.max ? "end" : "middle");
    var label = (dim.format === "moyenne" && dim.max <= 7) ? String(v).replace(".", ",") : String(Math.round(v));
    parts.push('<text class="tick" x="' + X(v) + '" y="' + (ty + th + 15) + '" text-anchor="' + anchor + '">' + label + '</text>');
  });
  /* marqueur */
  parts.push('<circle class="mark" cx="' + X(Math.max(dim.min, Math.min(dim.max, score))) + '" cy="' + (ty + th/2) + '" r="7"/>');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Score ' + esc(fmtScore(dim, score)) + ' sur une échelle de ' + dim.min + ' à ' + dim.max + '">' + parts.join("") + '</svg>';
}

/* ---------- Courbe d'évolution (SVG) ---------- */
function lineChartSVG(dim, entries){
  var W = 340, H = 180, l = 34, r = 14, t = 14, b = 28;
  var span = dim.max - dim.min;
  function Y(v){ return t + (1 - (v - dim.min) / span) * (H - t - b); }
  var n = entries.length;
  function Xi(i){ return n === 1 ? (l + (W - l - r)/2) : l + i / (n - 1) * (W - l - r); }
  var parts = [];
  /* fond : bandes (repères de zones) */
  var prev = dim.min;
  dim.bandes.forEach(function(bd){
    var ya = Y(Math.min(bd.max, dim.max)), yb = Y(prev);
    parts.push('<rect class="seg ' + bd.niveau + '" opacity="0.55" x="' + l + '" y="' + ya + '" width="' + (W - l - r) + '" height="' + Math.max(0, yb - ya) + '"/>');
    prev = bd.max;
  });
  /* grille horizontale : bornes de bandes, libellés à gauche */
  var seen = {};
  [dim.min].concat(dim.bandes.map(function(bd){ return Math.min(bd.max, dim.max); })).forEach(function(v){
    var key = String(Math.round(v*10)); if (seen[key]) return; seen[key] = 1;
    parts.push('<line class="gridln" x1="' + l + '" y1="' + Y(v) + '" x2="' + (W - r) + '" y2="' + Y(v) + '"/>');
    var label = (dim.format === "moyenne" && dim.max <= 7) ? String(v).replace(".", ",") : String(Math.round(v));
    parts.push('<text class="tick" x="' + (l - 5) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end">' + label + '</text>');
  });
  parts.push('<line class="axisln" x1="' + l + '" y1="' + (H - b) + '" x2="' + (W - r) + '" y2="' + (H - b) + '"/>');
  /* ligne + points */
  if (n > 1){
    var d = entries.map(function(e, i){ return (i ? "L" : "M") + Xi(i) + " " + Y(e.v); }).join(" ");
    parts.push('<path class="ln" d="' + d + '"/>');
  }
  entries.forEach(function(e, i){
    parts.push('<circle class="pt" cx="' + Xi(i) + '" cy="' + Y(e.v) + '" r="4.5"><title>' + esc(fmtDate(e.date)) + " : " + esc(fmtScore(dim, e.v)) + '</title></circle>');
  });
  /* étiquette directe : dernier point uniquement */
  var last = entries[n-1];
  var ly = Y(last.v) - 9; if (ly < t + 8) ly = Y(last.v) + 17;
  parts.push('<text class="lbl" x="' + Math.min(Xi(n-1), W - r - 4) + '" y="' + ly + '" text-anchor="end">' + fmtScore(dim, last.v) + '</text>');
  /* dates première / dernière */
  parts.push('<text class="lblm" x="' + l + '" y="' + (H - 8) + '">' + esc(fmtDate(entries[0].date)) + '</text>');
  if (n > 1) parts.push('<text class="lblm" x="' + (W - r) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(fmtDate(last.date)) + '</text>');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Évolution du score">' + parts.join("") + '</svg>';
}

/* ---------- Sparkline ---------- */
function sparkSVG(dim, entries){
  var W = 92, H = 30, p = 4;
  if (entries.length < 2) return "";
  var span = dim.max - dim.min;
  function Y(v){ return p + (1 - (v - dim.min) / span) * (H - 2*p); }
  function X(i){ return p + i / (entries.length - 1) * (W - 2*p); }
  var d = entries.map(function(e, i){ return (i ? "L" : "M") + X(i) + " " + Y(e.v); }).join(" ");
  var lastX = X(entries.length-1), lastY = Y(entries[entries.length-1].v);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true">' +
    '<path class="ln" style="stroke-width:1.5" d="' + d + '"/>' +
    '<circle class="pt" cx="' + lastX + '" cy="' + lastY + '" r="3"/></svg>';
}

/* ---------- Carte attachement (2 dimensions) ---------- */
function ecrMapSVG(anx, evit){
  var S = 240, p = 30;
  function C(v){ return p + (v - 1) / 6 * (S - 2*p); }
  var mid = C(4);
  var parts = [];
  parts.push('<rect x="' + p + '" y="' + p + '" width="' + (S-2*p) + '" height="' + (S-2*p) + '" fill="none" class="gridln" stroke-width="1"/>');
  parts.push('<line class="axisln" x1="' + mid + '" y1="' + p + '" x2="' + mid + '" y2="' + (S-p) + '"/>');
  parts.push('<line class="axisln" x1="' + p + '" y1="' + mid + '" x2="' + (S-p) + '" y2="' + mid + '"/>');
  var lbl = function(x, y, txt, anchor){ return '<text class="lblm" x="' + x + '" y="' + y + '" text-anchor="' + (anchor||"middle") + '">' + txt + '</text>'; };
  parts.push(lbl((p+mid)/2, p - 8, "Détaché-évitant"));
  parts.push(lbl((mid+S-p)/2, p - 8, "Craintif-évitant"));
  parts.push(lbl((p+mid)/2, S - p + 16, "Plutôt sécure"));
  parts.push(lbl((mid+S-p)/2, S - p + 16, "Préoccupé"));
  parts.push('<text class="lblm" transform="rotate(-90 12 ' + (S/2) + ')" x="12" y="' + (S/2) + '" text-anchor="middle">Évitement ↑</text>');
  parts.push(lbl(S/2, S - 2, "Anxiété d'abandon →"));
  parts.push('<circle class="pt" cx="' + C(anx) + '" cy="' + (S - C(evit)) + '" r="7"><title>Anxiété ' + String(Math.round(anx*10)/10).replace(".", ",") + " · Évitement " + String(Math.round(evit*10)/10).replace(".", ",") + '</title></circle>');
  return '<svg class="quad" viewBox="0 0 ' + S + ' ' + S + '" width="240" style="max-width:100%;margin:0 auto" role="img" aria-label="Position sur les deux dimensions de l\'attachement">' + parts.join("") + '</svg>';
}

/* ---------- Delta sémantique ---------- */
function deltaHTML(dim, now, before){
  if (before === null || before === undefined) return "";
  var d = Math.round((now - before) * 10) / 10;
  if (Math.abs(d) < 1e-9) return '<span class="delta-neu">→ stable</span>';
  var up = d > 0;
  var txt = (up ? "+" : "−") + String(Math.abs(d)).replace(".", ",");
  if (dim.valence === null || dim.valence === undefined) return '<span class="delta-neu">' + (up ? "▲" : "▼") + " " + txt + "</span>";
  var good = (dim.valence === true && up) || (dim.valence === false && !up);
  return '<span class="' + (good ? "delta-good" : "delta-bad") + '">' + (up ? "▲" : "▼") + " " + txt + " " + (good ? "(mieux)" : "(moins bien)") + "</span>";
}

  if (nDone) html += '<button class="btn" onclick="go(\'#/bord\')">Voir mon tableau de bord (' + nDone + " test" + (nDone>1?"s":"") + " fait" + (nDone>1?"s":"") + ")</button>";
  ORDRE_CATS.forEach(function(cat){
    if (!cats[cat]) return;
    html += '<div class="catlabel">' + esc(cat) + "</div>";
    cats[cat].forEach(function(t){
      var last = Store.latest(t.id);
      var status = last ? '<span class="done">Fait le ' + esc(fmtDate(last.date)) + "</span>" : '<span class="muted small">Jamais fait</span>';
      html += '<div class="card tap" onclick="go(\'#/test/' + t.id + '\')" onkeydown="cardKey(event)" role="button" tabindex="0">' +
        "<b>" + esc(t.nom) + "</b>" +
        '<div class="testmeta">' + esc(t.sigle) + " · " + esc(t.duree) + "</div>" +
        '<div style="margin-top:4px">' + status + "</div></div>";
    });
  });
  html += footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------------- INTRO D'UN TEST ---------------- */
function vTestIntro(id){
  setNav("home");
  var t = byId(id); if (!t) return vHome();
  var last = Store.latest(t.id);
  var html = '<p class="small"><a href="#/">← Tous les tests</a></p>' +
    '<span class="pill">' + esc(t.cat) + "</span>" +
    "<h1>" + esc(t.nom) + "</h1>" +
    '<p class="small muted">' + esc(t.sigle) + " · " + esc(t.duree) + " · " + t.items.length + " questions</p>" +
    "<p>" + esc(t.intro) + "</p>";
  if (t.avertissement) html += '<div class="avert"><b>À savoir avant de commencer.</b> ' + esc(t.avertissement) + "</div>";
  html += '<div class="card"><b>Consigne.</b> <span class="ink2">' + esc(t.consigne) + "</span></div>" +
    '<button class="btn" onclick="startTest(\'' + t.id + '\')">' + (last ? "Refaire le test" : "Commencer") + "</button>";
  if (last) html += '<button class="btn ghost" onclick="go(\'#/res/' + t.id + '\')">Voir mon dernier résultat (' + esc(fmtDate(last.date)) + ")</button>";
  html += sourceDetails(t) + footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}
function sourceDetails(t){
  var refs = t.source.refs.map(function(r){ return "<li>" + esc(r) + "</li>"; }).join("");
  return "<details><summary>Instrument &amp; références</summary>" +
    "<p class=\"small\"><b>" + esc(t.source.instrument) + "</b></p>" +
    '<p class="small ink2">' + esc(t.source.statut) + "</p>" +
    '<ul class="reslist">' + refs + "</ul></details>";
}

/* ---------------- PASSATION ---------------- */
function startTest(id){
  var t = byId(id);
  RUN = { test: t, answers: new Array(t.items.length), i: 0 };
  renderRun();
}
function renderRun(){
  var nv = document.querySelector("nav"); if (nv) nv.style.display = "none";
  var t = RUN.test, i = RUN.i, n = t.items.length;
  var it = t.items[i];
  var ech = itemScale(t, it);
  var opts = ech.labels.map(function(lab, k){
    var v = ech.valeurs[k];
    var sel = RUN.answers[i] === v ? " sel" : "";
    return '<button class="opt' + sel + '" onclick="answer(' + v + ')">' + esc(lab) + "</button>";
  }).join("");
  $app.innerHTML =
    '<div class="hdr"><b>' + esc(t.nom) + '</b><button class="linkbtn" onclick="quitRun()">Abandonner</button></div>' +
    '<div class="progress"><i style="width:' + Math.round(i/n*100) + '%"></i></div>' +
    '<div class="qcount">Question ' + (i+1) + " sur " + n + "</div>" +
    '<div class="consigne">' + esc(t.consigne) + "</div>" +
    '<div class="qtext">' + esc(it.t) + "</div>" + opts +
    '<div class="runnav">' + (i > 0 ? '<button class="linkbtn" onclick="prevQ()">← Question précédente</button>' : "<span></span>") + "</div>";
  window.scrollTo(0, 0);
}
function answer(v){
  RUN.answers[RUN.i] = v;
  if (RUN.i < RUN.test.items.length - 1){
    RUN.i++;
    setTimeout(renderRun, 120);
  } else {
    finalizeRun();
  }
}
function prevQ(){ if (RUN && RUN.i > 0){ RUN.i--; renderRun(); } }
function quitRun(){
  if (confirm("Abandonner ce test ? Vos réponses en cours seront perdues.")){
    RUN = null;
    if (location.hash === "#/") vHome(); else go("#/");
  }
}
function finalizeRun(){
  var t = RUN.test;
  var res = computeScores(t, RUN.answers);
  Store.add(t.id, { date: new Date().toISOString(), scores: res.scores, flags: res.flags });
  RUN = null;
  if (location.hash === "#/res/" + t.id) vRes(t.id); else go("#/res/" + t.id);
}

/* ---------------- RÉSULTATS ---------------- */
function ameliorationHTML(dim){
  var a = dim.amelioration; if (!a) return "";
  var axes = (a.axes || []).map(function(x){ return '<div class="axe"><b>' + esc(x.titre) + "</b><p>" + esc(x.texte) + "</p></div>"; }).join("");
  var html = "<details><summary>Axes d'amélioration &amp; comment y arriver</summary>";
  if (a.intro) html += '<p class="small ink2">' + esc(a.intro) + "</p>";
  html += axes;
  if (a.objectif) html += '<div class="objectif"><b>Votre plan.</b> ' + esc(a.objectif) + "</div>";
  if (a.consulter) html += '<div class="consult"><b>Quand consulter ?</b> ' + esc(a.consulter) + "</div>";
  html += "</details>";
  if (a.ressources && a.ressources.length){
    html += "<details><summary>Ressources sérieuses</summary><ul class=\"reslist\">" +
      a.ressources.map(function(r){ return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></details>";
  }
  return html;
}
function ecrStyle(anx, evit){
  var a = anx > 4, e = evit > 4;
  if (!a && !e) return { nom: "plutôt sécure", txt: "Vos deux dimensions sont dans la zone basse : la proximité vous est accessible sans peur excessive de l'abandon. C'est le profil associé aux relations les plus stables — à entretenir, pas à tenir pour acquis." };
  if (a && !e) return { nom: "plutôt préoccupé", txt: "Anxiété d'abandon marquée avec un évitement bas : vous recherchez la proximité mais la peur de la perdre génère inquiétude et besoin de réassurance. Axe prioritaire : les stratégies d'auto-apaisement et la demande directe (voir « Anxiété d'abandon »)." };
  if (!a && e) return { nom: "plutôt détaché-évitant", txt: "Évitement marqué avec une anxiété basse : l'autonomie prime et la proximité émotionnelle vous coûte. Axe prioritaire : l'auto-dévoilement gradué (voir « Évitement de l'intimité »)." };
  return { nom: "plutôt craintif-évitant", txt: "Les deux dimensions sont élevées : désir de lien ET peur du lien coexistent, ce qui est inconfortable et souvent épuisant. C'est le profil qui bénéficie le plus d'un accompagnement (thérapie individuelle ou de couple) — et il évolue réellement avec le travail." };
}
function vRes(id){
  setNav("home");
  var t = byId(id); if (!t) return vHome();
  var rec = Store.latest(id);
  if (!rec) return vTestIntro(id);
  var prev = Store.previous(id);
  var html = '<p class="small"><a href="#/">← Tous les tests</a></p><h1>' + esc(t.nom) + "</h1>" +
    '<p class="small muted">Fait le ' + esc(fmtDateH(rec.date)) + (prev ? " · précédent : " + esc(fmtDate(prev.date)) : "") + "</p>";
  if (rec.flags && rec.flags.crise) html += urgenceHTML();
  if (t.avertissement) html += '<div class="avert">' + esc(t.avertissement) + "</div>";
  Object.keys(t.dims).forEach(function(k){
    var dim = t.dims[k];
    var v = rec.scores[k];
    var band = bandOf(dim, v);
    var d = prev ? deltaHTML(dim, v, prev.scores[k]) : "";
    html += '<div class="card dimblock"><h3 style="margin-top:0">' + esc(dim.nom) + "</h3>" +
      '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">' + fmtOutOf(dim, v) + chipHTML(band) + (d ? '<span class="small">' + d + "</span>" : "") + "</div>" +
      gaugeSVG(dim, v) +
      "<p>" + esc(band.texte) + "</p>" +
      '<p class="small muted">' + esc(dim.descriptif) + "</p>" +
      ameliorationHTML(dim) + "</div>";
  });
  if (t.special === "amour"){
    var ranked = Object.keys(t.dims).map(function(k){ return { k: k, dim: t.dims[k], v: rec.scores[k] }; })
      .sort(function(a, b){ return b.v - a.v; });
    var lis = ranked.map(function(r, i){
      var band = bandOf(r.dim, r.v);
      return '<p style="margin:6px 0"><b>' + (i+1) + ". " + esc(r.dim.nom) + "</b> — " + fmtScore(r.dim, r.v) + "/5 <span class=\"muted small\">(" + esc(band.label) + ")</span></p>";
    }).join("");
    var tete = ranked[0], second = ranked[1];
    var phrase = "Votre canal le plus sensible : <b>" + esc(tete.dim.nom.toLowerCase()) + "</b>";
    if (second && (tete.v - second.v) <= 0.3) phrase += ", avec « " + esc(second.dim.nom.toLowerCase()) + " » quasiment au même niveau";
    phrase += ".";
    html += '<div class="card"><h3 style="margin-top:0">Votre hiérarchie de préférences</h3>' + lis +
      "<p>" + phrase + '</p><p class="small ink2">La partie utile — et réellement étayée : montrez ce classement à votre partenaire, demandez le sien, puis pratiquez la <b>réactivité perçue</b> : remarquer, comprendre et répondre à ce qui compte pour l\'autre. C\'est elle qui prédit la satisfaction du couple dans la recherche — pas l\'appariement des « langages » (Impett et al., 2024).</p></div>';
  }
  if (t.special === "ecr"){
    var st = ecrStyle(rec.scores.ANX, rec.scores.EVIT);
    html += '<div class="card"><h3 style="margin-top:0">Lecture combinée : style ' + esc(st.nom) + "</h3>" +
      ecrMapSVG(rec.scores.ANX, rec.scores.EVIT) +
      "<p>" + esc(st.txt) + '</p><p class="small muted">Les « styles » sont des repères de lecture aux croisements de deux dimensions continues — pas des cases définitives. Ils évoluent avec les expériences relationnelles et le travail personnel (« sécurité gagnée »).</p></div>';
  }
  var cad = CADENCE[t.id];
  if (cad) html += '<div class="notice">Suivi : refaites ce test dans <b>' + cad + "</b> — c'est l'évolution de la courbe qui est informative, pas une mesure isolée.</div>";
  html += '<button class="btn ghost" onclick="startTest(\'' + t.id + '\')">Refaire le test</button>' +
    '<button class="btn ghost" onclick="go(\'#/hist/' + t.id + '\')">Historique &amp; évolution</button>' +
    '<button class="btn" onclick="go(\'#/bord\')">Tableau de bord</button>' +
    "<details><summary>Comment ce score est calculé</summary><p class=\"small ink2\">" + esc(t.scoringNote) + "</p></details>" +
    sourceDetails(t) + footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------------- HISTORIQUE ---------------- */
function vHist(id){
  setNav("home");
  var t = byId(id); if (!t) return vHome();
  var hist = Store.hist(id);
  if (!hist.length) return vTestIntro(id);
  var html = '<p class="small"><a href="#/res/' + t.id + '">← Dernier résultat</a></p><h1>' + esc(t.nom) + " — évolution</h1>";
  Object.keys(t.dims).forEach(function(k){
    var dim = t.dims[k];
    var entries = hist.map(function(r){ return { date: r.date, v: r.scores[k] }; });
    html += '<div class="card"><h3 style="margin-top:0">' + esc(dim.nom) + "</h3>" + lineChartSVG(dim, entries) + "</div>";
  });
  var keys = Object.keys(t.dims);
  var headCells = keys.map(function(k){ return "<th>" + esc(keys.length > 1 ? (t.dims[k].nom.length > 14 ? k : t.dims[k].nom) : "Score") + "</th>"; }).join("");
  var rows = hist.slice().reverse().map(function(r){
    var cells = keys.map(function(k){
      var dim = t.dims[k], v = r.scores[k], band = bandOf(dim, v);
      return "<td>" + fmtScore(dim, v) + ' <span class="muted small">(' + esc(band.label) + ")</span></td>";
    }).join("");
    return "<tr><td>" + esc(fmtDate(r.date)) + "</td>" + cells + "</tr>";
  }).join("");
  html += '<div class="card"><h3 style="margin-top:0">Toutes les mesures</h3><div style="overflow-x:auto"><table><tr><th>Date</th>' + headCells + "</tr>" + rows + "</table></div></div>";
  html += '<button class="btn ghost" onclick="startTest(\'' + t.id + '\')">Refaire le test</button>' + footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------------- TABLEAU DE BORD ---------------- */
function vBord(){
  setNav("bord");
  var taken = TESTS.map(function(t){ return { t: t, rec: Store.latest(t.id) }; }).filter(function(x){ return x.rec; });
  var html = persistBanner() + "<h1>Tableau de bord</h1>";
  if (!taken.length){
    html += '<p class="ink2">Aucun test encore fait. Pour un premier état des lieux en 5 minutes, enchaînez ces trois-là :</p>' +
      '<div class="card tap" onclick="go(\'#/test/who5\')" onkeydown="cardKey(event)" role="button" tabindex="0"><b>Bien-être (WHO-5)</b><div class="testmeta">1 min — le thermomètre du moral</div></div>' +
      '<div class="card tap" onclick="go(\'#/test/gad7\')" onkeydown="cardKey(event)" role="button" tabindex="0"><b>Anxiété (GAD-7)</b><div class="testmeta">1-2 min — repérage validé</div></div>' +
      '<div class="card tap" onclick="go(\'#/test/rosenberg\')" onkeydown="cardKey(event)" role="button" tabindex="0"><b>Estime de soi (Rosenberg)</b><div class="testmeta">2 min — le classique</div></div>' + footHTML();
    $app.innerHTML = html; window.scrollTo(0,0); return;
  }
  /* priorités */
  var prios = [];
  taken.forEach(function(x){
    Object.keys(x.t.dims).forEach(function(k){
      var dim = x.t.dims[k], v = x.rec.scores[k], band = bandOf(dim, v);
      if (band.niveau === "alerte" || band.niveau === "attention"){
        prios.push({ t: x.t, dim: dim, k: k, v: v, band: band,
          poids: (band.niveau === "alerte" ? 0 : 10) + (x.t.cat === "Clinique — repérage" ? 0 : 1) });
      }
    });
  });
  prios.sort(function(a, b){ return a.poids - b.poids; });
  html += '<div class="card"><h3 style="margin-top:0">Vos axes prioritaires</h3>';
  if (!prios.length){
    html += '<p class="ink2">Aucune zone d\'alerte dans vos derniers résultats. Continuez le suivi régulier — et si un domaine vous questionne, son test vous attend.</p>';
  } else {
    prios.slice(0, 6).forEach(function(p){
      var axe1 = p.dim.amelioration && p.dim.amelioration.axes && p.dim.amelioration.axes.length ? p.dim.amelioration.axes[0].titre : "";
      html += '<div class="prio"><span class="dot ' + p.band.niveau + '"></span><div>' +
        "<b>" + esc(p.dim.nom) + "</b> — " + esc(p.band.label) + " (" + fmtScore(p.dim, p.v) + "/" + p.dim.max + ")" +
        (axe1 ? '<div class="small ink2">Première action : ' + esc(axe1) + "</div>" : "") +
        '<div class="small"><a href="#/res/' + p.t.id + '">Voir les axes détaillés →</a></div></div></div>';
    });
    if (prios.length > 6) html += '<p class="small muted">+ ' + (prios.length - 6) + " autre(s) point(s) d'attention — voir les résultats détaillés.</p>";
  }
  html += "</div>";
  /* plan de suivi */
  html += '<div class="card"><h3 style="margin-top:0">Plan de suivi</h3><p class="small ink2">Refaites régulièrement les tests pour transformer des points en courbes — c\'est le seul moyen fiable de mesurer une progression :</p>';
  taken.forEach(function(x){
    var cad = CADENCE[x.t.id] || "quelques semaines";
    html += '<p class="small" style="margin:4px 0">· <b>' + esc(x.t.nom) + "</b> : tous les " + esc(cad) + " <span class=\"muted\">(dernier : " + esc(fmtDate(x.rec.date)) + ")</span></p>";
  });
  html += "</div>";
  /* cartes par test */
  taken.forEach(function(x){
    var hist = Store.hist(x.t.id);
    var prev = Store.previous(x.t.id);
    var inner = "";
    Object.keys(x.t.dims).forEach(function(k){
      var dim = x.t.dims[k], v = x.rec.scores[k], band = bandOf(dim, v);
      var entries = hist.map(function(r){ return { date: r.date, v: r.scores[k] }; });
      inner += '<div class="sparkwrap">' + chipHTML(band) +
        "<b>" + fmtScore(dim, v) + "</b>" +
        (prev ? '<span class="small">' + deltaHTML(dim, v, prev.scores[k]) + "</span>" : "") +
        '<span class="small muted">' + esc(dim.nom) + "</span>" +
        '<span class="right">' + sparkSVG(dim, entries) + "</span></div>";
    });
    html += '<div class="card tap" onclick="go(\'#/res/' + x.t.id + '\')" onkeydown="cardKey(event)" role="button" tabindex="0"><b>' + esc(x.t.nom) + '</b> <span class="small muted">· ' + esc(fmtDate(x.rec.date)) + "</span>" + inner + "</div>";
  });
  var reste = TESTS.filter(function(t){ return !Store.latest(t.id); });
  if (reste.length){
    html += '<div class="catlabel">À explorer</div><p class="small ink2">' +
      reste.map(function(t){ return '<a href="#/test/' + t.id + '">' + esc(t.nom) + "</a>"; }).join(" · ") + "</p>";
  }
  html += footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------------- MÉTHODE & DONNÉES ---------------- */
function vMethode(){
  setNav("meth");
  var html = persistBanner() + "<h1>Méthode, références &amp; aide</h1><p class=\"ink2\">" + esc(METHODE.intro) + "</p>";
  METHODE.sections.forEach(function(s){
    html += "<h2>" + esc(s.t) + "</h2>" + s.p.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  });
  html += urgenceHTML();
  html += "<h2>Références générales</h2><ul class=\"reslist\">" + METHODE.refsGlobales.map(function(r){ return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>";
  html += '<h2>Vos données</h2><div class="card">' +
    '<p class="small ink2">Tout est stocké localement sur cet appareil. Exportez régulièrement une sauvegarde (fichier JSON) que vous pourrez réimporter ici, par exemple après un changement de téléphone.</p>' +
    '<button class="btn ghost slim" onclick="exportData()">Exporter mes résultats</button> ' +
    '<button class="btn ghost slim" onclick="document.getElementById(\'impfile\').click()">Importer une sauvegarde</button> ' +
    '<button class="btn ghost slim" onclick="resetData()">Tout effacer</button>' +
    '<input type="file" id="impfile" accept=".json,application/json" style="display:none" onchange="importData(this)">' +
    '<div id="dataMsg" class="small" style="margin-top:8px"></div></div>';
  html += footHTML();
  $app.innerHTML = html;
  window.scrollTo(0, 0);
}
function exportData(){
  var txt = Store.exportJSON();
  var msg = document.getElementById("dataMsg");
  try {
    var blob = new Blob([txt], { type: "application/json" });
    var a = document.createElement("a");
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = "iris-sauvegarde-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    if (msg) msg.textContent = "Sauvegarde téléchargée.";
  } catch(e){
    if (msg) msg.textContent = "Téléchargement impossible ici — copiez le contenu ci-dessous :";
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.width = "100%"; ta.style.height = "120px";
    msg.parentNode.appendChild(ta); ta.select();
  }
}
function importData(input){
  var f = input.files && input.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var msg = document.getElementById("dataMsg");
    try {
      var n = Store.importJSON(String(reader.result));
      if (msg) msg.textContent = n + " mesure(s) importée(s).";
    } catch(e){ if (msg) msg.textContent = "Fichier non reconnu."; }
  };
  reader.readAsText(f);
  input.value = "";
}
function resetData(){
  if (confirm("Effacer TOUS vos résultats de cet appareil ?") && confirm("Vraiment tout effacer ? Cette action est définitive (pensez à exporter avant).")){
    Store.reset();
    var msg = document.getElementById("dataMsg");
    if (msg) msg.textContent = "Données effacées.";
  }
}

/* ---------------- ROUTEUR ---------------- */
function render(){
  RUN = null;
  var nv = document.querySelector("nav"); if (nv) nv.style.display = "";
  var h = location.hash || "#/";
  var m;
  if (h === "#/" || h === "") return vHome();
  if (h === "#/bord") return vBord();
  if (h === "#/methode") return vMethode();
  if ((m = h.match(/^#\/test\/([a-z0-9]+)$/))) return vTestIntro(m[1]);
  if ((m = h.match(/^#\/res\/([a-z0-9]+)$/))) return vRes(m[1]);
  if ((m = h.match(/^#\/hist\/([a-z0-9]+)$/))) return vHist(m[1]);
  vHome();
}
window.addEventListener("hashchange", render);
render();
</script>
