<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Iris — auto-évaluations psychologiques sérieuses</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --good-text:#006300;
  --seg-ok:rgba(12,163,12,.13); --seg-ok-c:rgba(12,163,12,.30);
  --seg-warn:rgba(250,178,25,.16); --seg-warn-c:rgba(250,178,25,.42);
  --seg-crit:rgba(208,59,59,.11); --seg-crit-c:rgba(208,59,59,.30);
  --seg-neu:rgba(137,135,129,.12); --seg-neu-c:rgba(137,135,129,.32);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
    --good-text:#0ca30c;
    --seg-ok:rgba(12,163,12,.16); --seg-ok-c:rgba(12,163,12,.38);
    --seg-warn:rgba(250,178,25,.13); --seg-warn-c:rgba(250,178,25,.38);
    --seg-crit:rgba(230,103,103,.13); --seg-crit-c:rgba(230,103,103,.36);
    --seg-neu:rgba(137,135,129,.14); --seg-neu-c:rgba(137,135,129,.40);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:.97rem; line-height:1.55;
}
#app{max-width:680px; margin:0 auto; padding:14px 14px 96px}
a{color:var(--accent); text-decoration:none}
h1{font-size:1.28rem; line-height:1.25; margin:.4rem 0 .5rem; letter-spacing:-.01em}
h2{font-size:1.06rem; margin:1.4rem 0 .5rem}
h3{font-size:.97rem; margin:1rem 0 .3rem}
p{margin:.45rem 0}
.small{font-size:.84rem} .muted{color:var(--muted)} .ink2{color:var(--ink2)}
.center{text-align:center}

/* ---- cards & chrome ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 16px; margin:10px 0}
.card.tap{cursor:pointer; transition:transform .06s} .card.tap:active{transform:scale(.985)}
.hdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.brand{font-weight:800; font-size:1.05rem; letter-spacing:-.01em}
.brand small{font-weight:500; color:var(--muted)}
.pill{display:inline-block; font-size:.72rem; font-weight:600; color:var(--ink2); background:var(--accent-soft); border-radius:99px; padding:2px 9px; margin-right:6px}
.pill.warnp{background:var(--seg-crit); color:var(--ink2)}
.testmeta{font-size:.8rem; color:var(--muted); margin-top:2px}
.done{font-size:.8rem; color:var(--good-text); font-weight:600}
.right{margin-left:auto}
hr{border:none; border-top:1px solid var(--grid); margin:14px 0}

/* ---- chips (statut : pastille + libellé, jamais couleur seule) ---- */
.chip{display:inline-flex; align-items:center; gap:7px; font-size:.86rem; font-weight:700}
.dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; border:1px solid var(--border)}
.dot.ok{background:var(--good)} .dot.attention{background:var(--warn)}
.dot.alerte{background:var(--crit)} .dot.neutre{background:var(--muted)} .dot.info{background:var(--accent)}

/* ---- buttons ---- */
.btn{display:block; width:100%; border:none; border-radius:12px; min-height:50px;
  background:var(--accent); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; padding:12px 16px; margin:8px 0}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.slim{min-height:42px; padding:8px 14px; font-size:.9rem; width:auto; display:inline-block}
.linkbtn{background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:0}

/* ---- passation ---- */
.progress{height:4px; background:var(--grid); border-radius:2px; margin:10px 0 4px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .2s}
.qcount{font-size:.78rem; color:var(--muted); margin:6px 0 2px}
.qtext{font-size:1.13rem; font-weight:700; line-height:1.4; margin:8px 0 14px}
.consigne{font-size:.84rem; color:var(--ink2); background:var(--accent-soft); border-radius:10px; padding:8px 12px}
.opt{display:block; width:100%; text-align:left; background:var(--surface); color:var(--ink);
  border:1.5px solid var(--line); border-radius:12px; min-height:50px; padding:12px 14px;
  font-size:.95rem; font-weight:600; margin:7px 0; cursor:pointer}
.opt:active,.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.runnav{display:flex; justify-content:space-between; align-items:center; margin-top:10px}

/* ---- résultats ---- */
.scorebig{font-size:1.9rem; font-weight:800; letter-spacing:-.02em}
.scorebig small{font-size:1rem; font-weight:600; color:var(--muted)}
.dimblock{margin:4px 0 6px}
svg{display:block}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.seg.ok{fill:var(--seg-ok)} .seg.ok.cur{fill:var(--seg-ok-c)}
.seg.attention{fill:var(--seg-warn)} .seg.attention.cur{fill:var(--seg-warn-c)}
.seg.alerte{fill:var(--seg-crit)} .seg.alerte.cur{fill:var(--seg-crit-c)}
.seg.neutre{fill:var(--seg-neu)} .seg.neutre.cur{fill:var(--seg-neu-c)}
.mark{fill:var(--ink); stroke:var(--surface); stroke-width:2}
.tick{fill:var(--muted); font-size:10px}
.gridln{stroke:var(--grid); stroke-width:1}
.axisln{stroke:var(--line); stroke-width:1}
.ln{stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}
.pt{fill:var(--accent); stroke:var(--surface); stroke-width:2}
.lbl{fill:var(--ink); font-size:11px; font-weight:700}
.lblm{fill:var(--muted); font-size:10px}
details{border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin:8px 0; background:var(--surface)}
details summary{cursor:pointer; font-weight:700; font-size:.93rem; color:var(--ink)}
details[open] summary{margin-bottom:6px}
.axe{margin:10px 0}
.axe b{display:block; margin-bottom:2px}
.axe p{margin:2px 0; color:var(--ink2)}
.objectif{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.92rem}
.reslist{padding-left:18px; margin:6px 0} .reslist li{margin:7px 0; font-size:.86rem; color:var(--ink2)}
.consult{border-left:3px solid var(--warn); padding:2px 0 2px 12px; margin:10px 0; font-size:.92rem}
.urgence{border:1.5px solid var(--crit); border-radius:12px; padding:12px 14px; margin:10px 0; background:var(--surface)}
.urgence h3{margin-top:0; color:var(--crit)}
.urgence li{margin:6px 0; font-size:.92rem}
.avert{font-size:.87rem; color:var(--ink2); border-left:3px solid var(--line); padding-left:12px; margin:10px 0}

/* ---- tableau / historique ---- */
table{width:100%; border-collapse:collapse; font-size:.88rem}
th{text-align:left; color:var(--muted); font-weight:600; font-size:.78rem; padding:6px 8px 6px 0; border-bottom:1px solid var(--grid)}
td{padding:7px 8px 7px 0; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums}
.delta-good{color:var(--good-text); font-weight:700}
.delta-bad{color:var(--crit); font-weight:700}
.delta-neu{color:var(--muted); font-weight:600}

/* ---- nav ---- */
nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:6px 0 max(8px, env(safe-area-inset-bottom)); z-index:10}
nav button{background:none; border:none; color:var(--muted); font-size:.7rem; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 18px; font-family:inherit}
nav button.on{color:var(--accent)}
nav svg{width:22px; height:22px}
.foot{margin-top:26px; font-size:.78rem; color:var(--muted); text-align:center}
.foot a{font-weight:600}
.catlabel{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 2px 6px}
.notice{font-size:.83rem; color:var(--ink2); background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:9px 12px; margin:10px 0}
.prio{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--grid)}
.prio:last-child{border-bottom:none}
.prio .dot{margin-top:5px}
.sparkwrap{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap}
.quad text{font-size:10px}
</style>
</head>
<body>
<div id="app" role="main"></div>
<nav aria-label="Navigation principale">
  <button id="nav-home" onclick="location.hash='#/'" aria-label="Tests">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Tests</button>
  <button id="nav-bord" onclick="location.hash='#/bord'" aria-label="Tableau de bord">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Suivi</button>
  <button id="nav-meth" onclick="location.hash='#/methode'" aria-label="Méthode et références">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="M12 16v-5M12 8h.01"/></svg>Méthode</button>
</nav>
<script>
